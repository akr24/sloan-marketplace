# Backend + frontend. Start with `make up` (which also brings up the database).
#
# Both compose files share the `sloan-marketplace` network so the backend can
# reach the db container by its service name.
name: sloan-marketplace

include:
  - docker-compose.db.yml

services:
  backend:
    build: ./backend
    container_name: sloan-marketplace-backend
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-dev}
      APP_URL: http://localhost:${FRONTEND_PORT:-5174}
      DATABASE_URL: postgres://${POSTGRES_USER:-sloan}:${POSTGRES_PASSWORD:-sloan}@db:5432/${POSTGRES_DB:-sloan_marketplace}?sslmode=disable
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5174}
      # Dev-only default; set a real one in .env (at least 32 characters).
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      # Optional integrations; see .env.example. Empty means log-only.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEB_ENABLED: ${WHATSAPP_WEB_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8081}
        VITE_BOT_NUMBER: ${VITE_BOT_NUMBER:-}
    container_name: sloan-marketplace-frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
